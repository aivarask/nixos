# https://docs.helix-editor.com/configuration.html#configuration
# pkill -USR1 hx
theme = "gruvbox"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"


[editor.file-picker]
hidden = false

[keys.normal]
C-s = ":w"

[keys.normal.g]
a = "code_action" # Maps `ga` to show possible code actions
