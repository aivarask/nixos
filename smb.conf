[global]
idmap config * : backend = tdb
invalid users=foo
passwd program=/run/wrappers/bin/passwd %u
security=USER
workgroup=WORKGROUP
server string=smbnix
netbios name=SMBNIX
hosts allow=192.168.1. 127.0.0.1 localhost
hosts deny=0.0.0.0/0
guest account=nobody

[public]
path=/srv/music
browsable=yes
read only=no
guest ok=yes
create mask=0644
directory mask=0755
force user=root
force group=root

