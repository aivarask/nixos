<style>
  #search {
    background-color: black;
    padding: 1rem;
    h3 {
      color: gray;
    }
  }
</style>
<div id="search">
  <h3>
    Search
  </h3>
  <input
    class="form-control"
    type="search"
    name="search"
    placeholder="Search..."
    hx-post="/search"
    hx-trigger="input changed delay:500ms, search, revealed"
    hx-target="#search-results"
    hx-indicator=".htmx-indicator"
  />
  <hr />
  <span class="htmx-indicator">Searching...</span>

  <pre id="search-results"></pre>
</div>

</script>
