[general]
import = []

[env]
WINIT_X11_SCALE_FACTOR = "3.0"

[window] # https://alacritty.org/config-alacritty.html#window
opacity     = 0.95
dimensions  = { lines = 40, columns = 120 }
decorations = "Transparent"

[[hints.enabled]]
command = "xdg-open" # On Linux/BSD
# command = "open" # On macOS
# command = { program = "cmd", args = [ "/c", "start", "" ] } # On Windows
hyperlinks      = true
post_processing = true
persist         = false
mouse.enabled   = true
binding         = { key = "O", mods = "Control|Shift" }
regex           = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"

[[hints.enabled]]
regex   = "[^ ]+\\.rs:\\d+:\\d+"
command = { program = "code", args = ["--goto"] }
mouse   = { enabled = true }

[[hints.enabled]]
regex   = "^(/[^/]+)+/?$"
command = { program = "cat", args = [] }
binding = { key = "O", mods = "Control|Shift" }

[font]
size = 8

[colors]
transparent_background_colors = true

# evaluates on shell completion
# [bell]
# duration = 300
# command  = { program = "notify-send", args = ["bell"] }

[keyboard] # https://alacritty.org/config-alacritty.html#keyboard
bindings = [
	{ key = "Return", mods = "Control", action = "SpawnNewInstance" },
	{ key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
	{ key = "L", mods = "Control|Shift", chars = "l" },
]

[debug] # https://alacritty.org/config-alacritty.html#debug
