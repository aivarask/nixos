program_options:
  tray: true
  notify: true
  automount: true
  file_manager: xdg-open

device_config:
    id_uuid: "/dev/disks/by-uuid/95C8-EFB4"
    options: [noexec, nodev]
    ignore: false
    automount: true

notifications:
  timeout: 1.5           # Notification timeout in seconds
  device_mounted: 5      # Show mount notifications for 5 seconds
