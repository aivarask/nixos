include $XDG_CONFIG_HOME/kitty/gruvbox_dark.conf
font_size 10.0
scrollback_lines 5000
scrollbar always
action_alias kitty_scrollback_nvim kitten '/root/.local/share/nvim/site/pack/hm/start/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
map kitty_mod+/      launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map shift+enter send_text all \x1b[13;2u
map ctrl+enter send_text all \x1b[13;5u
map alt+tab next_tab
map alt+t new_tab

# term xterm-256color
term xterm-kitty

scrollback_pager_history_size 10
mouse_hide_wait -3.0

# hyperlinks {{{
detect_urls yes
allow_hyperlinks yes
show_hyperlink_targets no
underline_hyperlinks always
# }}}

repaint_delay 10
input_delay 3
sync_to_monitor yes
enable_audio_bell False
inactive_text_alpha 0.5
hide_window_decorations yes
confirm_os_window_close 0
tab_bar_style powerline

allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled
notify_on_cmd_finish invisible 10.0 command notify-send "job finished with status: %s" %c
wayland_titlebar_color system
